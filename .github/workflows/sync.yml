name: Sync LeetCode

on:
  schedule:
    - cron: "30 18 * * *"   # daily, 00:00 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/**", "sync.py"]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch new submissions and rebuild topic folders
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF: ${{ secrets.LEETCODE_CSRF }}
        run: python sync.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Sync LeetCode solutions" && git push)
